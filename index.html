<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WOFF & WOFF2 to TTF Converter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.02);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .dropzone input { display: none; }
    .dropzone span { display: block; color: var(--text-muted); font-size: 0.95rem; margin-top: 8px; }

    .btn {
      display: inline-block;
      margin-top: 12px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 6px;
      pointer-events: none;
    }

    #file-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.875rem;
      gap: 12px;
    }

    .file-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: var(--text);
    }

    .orig-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status { font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .status.processing { color: var(--accent); }
    .status.error { color: var(--error); }

    .download-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .download-btn:hover { background: var(--accent-hover); }
  </style>

  <!-- Pako (WOFF v1) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <!-- Google WOFF2 WASM Decoder -->
  <script src="https://unpkg.com/wawoff2@2.0.1/build/decompress_binding.js"></script>
  <!-- OpenType.js to parse font metadata -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>Font Converter</h1>
    <p class="subtitle">Converts WOFF & WOFF2 to TTF with automatic name detection.</p>

    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".woff,.woff2" multiple>
      <div class="btn">Select Font Files</div>
      <span>or drag and drop .woff / .woff2 files here</span>
    </div>

    <div id="file-list"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');

    let wasmReadyPromise = new Promise((resolve) => {
      if (typeof Module !== 'undefined') {
        if (Module.onRuntimeInitialized) {
          const oldInit = Module.onRuntimeInitialized;
          Module.onRuntimeInitialized = () => { oldInit(); resolve(); };
        } else {
          Module.onRuntimeInitialized = resolve;
        }
        if (Module.decompress) resolve();
      } else {
        window.addEventListener('load', () => {
          if (typeof Module !== 'undefined' && Module.decompress) resolve();
          else setTimeout(resolve, 1000);
        });
      }
    });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer && e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) handleFiles(fileInput.files);
    });

    async function handleFiles(files) {
      for (const file of Array.from(files)) await processFile(file);
      fileInput.value = '';
    }

    async function processFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const fallbackName = file.name.replace(/\.[^/.]+$/, "");
      
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <div class="file-meta">
          <span class="file-name">${file.name}</span>
          <span class="orig-name">Converting...</span>
        </div>
        <span class="status processing">Working...</span>
      `;
      fileList.appendChild(item);

      const statusEl = item.querySelector('.status');
      const nameEl = item.querySelector('.file-name');
      const metaEl = item.querySelector('.orig-name');

      try {
        const buffer = await file.arrayBuffer();
        let ttfBuffer;

        if (ext === 'woff2') {
          await wasmReadyPromise;
          if (typeof Module === 'undefined' || !Module.decompress) {
            throw new Error('WOFF2 decoder not ready yet.');
          }

          const rawOut = Module.decompress(buffer);
          // Detach from the Emscripten WASM heap to get a clean ArrayBuffer slice
          ttfBuffer = rawOut.buffer.slice(rawOut.byteOffset, rawOut.byteOffset + rawOut.byteLength);

        } else if (ext === 'woff') {
          ttfBuffer = convertWoffToTtf(buffer);
        } else {
          throw new Error('Unsupported format: .' + ext);
        }

        // Extract metadata using opentype.js first, then binary fallback
        const detectedName = getFontName(ttfBuffer);
        const finalFontName = (detectedName && detectedName.trim().length > 0) 
          ? detectedName.trim() 
          : fallbackName;

        const cleanFileName = finalFontName.replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').trim();

        nameEl.innerText = `${finalFontName}.ttf`;
        metaEl.innerText = `Original: ${file.name}`;

        const blob = new Blob([ttfBuffer], { type: 'font/ttf' });
        const url = URL.createObjectURL(blob);

        statusEl.remove();
        
        const dlBtn = document.createElement('a');
        dlBtn.className = 'download-btn';
        dlBtn.href = url;
        dlBtn.download = `${cleanFileName}.ttf`;
        dlBtn.innerText = 'Download .TTF';
        item.appendChild(dlBtn);

      } catch (err) {
        console.error(err);
        statusEl.className = 'status error';
        statusEl.innerText = err.message || 'Conversion failed';
      }
    }

    // Comprehensive font name parser
    function getFontName(buffer) {
      // 1. Try opentype.js
      if (typeof window.opentype !== 'undefined') {
        try {
          const font = window.opentype.parse(buffer);
          if (font && font.names) {
            const fullName = font.names.fullName ? (font.names.fullName.en || Object.values(font.names.fullName)[0]) : null;
            const fontSubfamily = font.names.fontSubfamily ? (font.names.fontSubfamily.en || Object.values(font.names.fontSubfamily)[0]) : '';
            const fontFamily = font.names.fontFamily ? (font.names.fontFamily.en || Object.values(font.names.fontFamily)[0]) : null;

            if (fullName) return fullName;
            if (fontFamily) return fontSubfamily && fontSubfamily !== 'Regular' ? `${fontFamily} ${fontSubfamily}` : fontFamily;
          }
        } catch (e) {
          console.warn('opentype parse fallback:', e);
        }
      }

      // 2. Binary fallback parser
      try {
        const view = new DataView(buffer);
        const numTables = view.getUint16(4, false);
        let nameTableOffset = 0;

        for (let i = 0; i < numTables; i++) {
          const tableOffset = 12 + i * 16;
          const tag = view.getUint32(tableOffset, false);
          if (tag === 0x6E616D65) { // 'name'
            nameTableOffset = view.getUint32(tableOffset + 8, false);
            break;
          }
        }

        if (!nameTableOffset) return null;

        const count = view.getUint16(nameTableOffset + 2, false);
        const stringOffset = nameTableOffset + view.getUint16(nameTableOffset + 4, false);

        let name4 = null;
        let name1 = null;

        for (let i = 0; i < count; i++) {
          const recOffset = nameTableOffset + 6 + i * 12;
          const platformID = view.getUint16(recOffset, false);
          const nameID = view.getUint16(recOffset + 6, false);
          const length = view.getUint16(recOffset + 8, false);
          const offset = stringOffset + view.getUint16(recOffset + 10, false);

          if (nameID === 4 || nameID === 1) {
            let str = '';
            if (platformID === 0 || platformID === 3) {
              for (let j = 0; j < length; j += 2) {
                str += String.fromCharCode(view.getUint16(offset + j, false));
              }
            } else {
              for (let j = 0; j < length; j++) {
                str += String.fromCharCode(view.getUint8(offset + j));
              }
            }
            str = str.replace(/\0/g, '').trim();

            if (nameID === 4 && !name4 && str) name4 = str;
            if (nameID === 1 && !name1 && str) name1 = str;
          }
        }

        return name4 || name1 || null;
      } catch (err) {
        return null;
      }
    }

    // WOFF (v1) unpacking logic
    function convertWoffToTtf(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      if (view.getUint32(0, false) !== 0x774F4646) throw new Error('Invalid WOFF signature.');

      const flavor = view.getUint32(4, false);
      const numTables = view.getUint16(12, false);
      const totalSfntSize = view.getUint32(16, false);

      const searchRange = Math.pow(2, Math.floor(Math.log2(numTables))) * 16;
      const entrySelector = Math.floor(Math.log2(numTables));
      const rangeShift = (numTables * 16) - searchRange;

      const out = new Uint8Array(totalSfntSize);
      const outView = new DataView(out.buffer);

      outView.setUint32(0, flavor, false);
      outView.setUint16(4, numTables, false);
      outView.setUint16(6, searchRange, false);
      outView.setUint16(8, entrySelector, false);
      outView.setUint16(10, rangeShift, false);

      let woffDirOffset = 44;
      let sfntDirOffset = 12;
      let sfntDataOffset = 12 + (16 * numTables);

      for (let i = 0; i < numTables; i++) {
        const tag = view.getUint32(woffDirOffset, false);
        const offset = view.getUint32(woffDirOffset + 4, false);
        const compLength = view.getUint32(woffDirOffset + 8, false);
        const origLength = view.getUint32(woffDirOffset + 12, false);
        const origChecksum = view.getUint32(woffDirOffset + 16, false);

        const tableData = new Uint8Array(arrayBuffer, offset, compLength);
        const decompressed = (compLength < origLength) ? pako.inflate(tableData) : tableData;

        while (sfntDataOffset % 4 !== 0) sfntDataOffset++;

        outView.setUint32(sfntDirOffset, tag, false);
        outView.setUint32(sfntDirOffset + 4, origChecksum, false);
        outView.setUint32(sfntDirOffset + 8, sfntDataOffset, false);
        outView.setUint32(sfntDirOffset + 12, origLength, false);

        out.set(decompressed, sfntDataOffset);
        sfntDataOffset += origLength;
        sfntDirOffset += 16;
        woffDirOffset += 20;
      }
      return out.buffer;
    }
  </script>
</body>
</html>
